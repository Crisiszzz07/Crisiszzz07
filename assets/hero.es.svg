  <text x="960" y="146" text-anchor="end" font-size="10" fill="#7b6a8f">bash — fedora</text>
  <g font-size="14"><text x="364" y="180" clip-path="url(#c0)"><tspan fill="#c77dff">cristy</tspan><tspan fill="#7b6a8f">@</tspan><tspan fill="#ff6ec7">fedora</tspan><tspan fill="#7b6a8f">:~$ </tspan><tspan fill="#f3e8ff">whoami</tspan></text><text x="364" y="206" clip-path="url(#c1)"><tspan fill="#9d8bb0">› </tspan><tspan fill="#e0aaff">Cristy · Ing. de Sistemas, 8vo semestre · Cartagena, CO</tspan></text><text x="364" y="232" clip-path="url(#c2)"><tspan fill="#c77dff">cristy</tspan><tspan fill="#7b6a8f">@</tspan><tspan fill="#ff6ec7">fedora</tspan><tspan fill="#7b6a8f">:~$ </tspan><tspan fill="#f3e8ff">cat focus.txt</tspan></text><text x="364" y="258" clip-path="url(#c3)"><tspan fill="#9d8bb0">› </tspan><tspan fill="#e0aaff">DevSecOps · arquitectura de software · Linux · open source</tspan></text><text x="364" y="284" clip-path="url(#c4)"><tspan fill="#c77dff">cristy</tspan><tspan fill="#7b6a8f">@</tspan><tspan fill="#ff6ec7">fedora</tspan><tspan fill="#7b6a8f">:~$ </tspan><tspan fill="#f3e8ff"></tspan></text><rect class="cursor" x="508" y="271" width="8" height="16" fill="#c77dff" opacity="0"><set attributeName="opacity" to="1" begin="3.85s"/></rect></g>
  <rect class="scan" x="351" y="152" width="618" height="2" fill="#c77dff" opacity="0"/>
</g>
<rect x="1" y="1" width="998" height="328" rx="18" fill="none" stroke="#5a189a" stroke-opacity=".6"/>
</svg>